services:
  - type: web
    name: touchgrass-agent
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: OFFLINE_MODE
        value: "true"
      - key: ENVIRONMENT
        value: production
